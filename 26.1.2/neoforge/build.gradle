plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-neoforge"
}

repositories {
    mavenCentral()
    // JEI, compile-only: the plugin is only loaded when JEI is installed.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
}

def convertedResources = layout.buildDirectory.dir("converted_resources").get().asFile

sourceSets {
    main {
        java {
            srcDirs += ['../../sharedConstants/src/main/java']
        }
        resources {
            srcDirs += ['src/main/resources']
            srcDirs += [convertedResources]
        }
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        pointblank_recipe {
            sourceSet sourceSets.main
        }
    }
}

import groovy.json.JsonSlurper
import groovy.json.JsonOutput

tasks.register('prepareResources', Copy) {
    from("../../shared_resources")
    into(convertedResources)

    doLast {
        fileTree(convertedResources).each { file ->
            if (file.name.endsWith(".json")) {
                def json = new JsonSlurper().parse(file)
                def changed = false

                if (json instanceof Map && json.containsKey("fabric:load_conditions")) {
                    def conds = json.remove("fabric:load_conditions")
                    conds.each { cond ->
                        if (cond.containsKey("condition")) {
                            cond.type = cond.remove("condition")
                        }
                    }
                    json["neoforge:conditions"] = conds
                    changed = true
                }

                if (changed) {
                    file.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
                }
            }
        }

        def convertIngredient
        convertIngredient = { obj ->
            if (obj instanceof Map) {
                if (obj.containsKey("item")) {
                    return obj.get("item")
                } else if (obj.containsKey("tag")) {
                    return "#" + obj.get("tag")
                } else {
                    def newMap = [:]
                    obj.each { k, v -> newMap[k] = convertIngredient(v) }
                    return newMap
                }
            } else if (obj instanceof List) {
                return obj.collect { convertIngredient(it) }
            }
            return obj
        }

        fileTree(convertedResources).matching {
            include "data/**/recipe/*.json"
        }.each { file ->
            def json = new JsonSlurper().parse(file)
            if (json.result instanceof Map) {
                if (json.result.containsKey("item")) {
                    json.result.id = json.result.remove("item")
                }
            }
            if (json.key instanceof Map) {
                json.key.keySet().each { k ->
                    json.key[k] = convertIngredient(json.key[k])
                }
            }
            if (json.ingredients instanceof List) {
                json.ingredients = json.ingredients.collect { convertIngredient(it) }
            }
            if (json.ingredient != null) {
                json.ingredient = convertIngredient(json.ingredient)
            }

            file.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
        }
    }
}

tasks.register('generateItemDefinitions') {
    dependsOn prepareResources

    doLast {
        def modelsDir = new File(convertedResources, "assets/pointblank_recipe/models/item")
        def itemsDir = new File(convertedResources, "assets/pointblank_recipe/items")
        itemsDir.mkdirs()

        modelsDir.listFiles().each { file ->
            def name = file.name.replace(".json", "")
            def linker = new File(itemsDir, file.name)
            linker.text = """{
  "model": {
    "type": "minecraft:model",
    "model": "pointblank_recipe:item/${name}"
  }
}"""
        }
    }
}

processResources {
    dependsOn prepareResources
    dependsOn generateItemDefinitions

    var replaceProperties = [
            minecraft_version: minecraft_version,
            neoforge_version: neoforge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_display_url: mod_display_url
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

classes.dependsOn prepareResources
neoForge.ideSyncTask prepareResources as Task

def targetJavaVersion = 25

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
}
